name: GRPO
multi_proc: True
params:
  gamma: 0.95
  gae_lambda: 0.95
  learning_rate: 1e-5
  ent_coef: 0.001
  clip_range: 0.2
  n_steps: 8192
  batch_size: 256
  n_epochs: 5
  max_grad_norm: 0.5
policy_kwargs:
  net_arch:
    - pi: [256, 128]
      vf: [256, 128]
  log_std_init: -1.60
schedule:
  variant: baseline
  preset: no_mid_jump_5m
  progress_trigger: False
  progress_threshold: 0.95
